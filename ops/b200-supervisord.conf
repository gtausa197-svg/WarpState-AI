[unix_http_server]
file=/workspace/WarpState/rtx6000_40b/work/control/b200-supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/WarpState/rtx6000_40b/work/logs/b200-supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/workspace/WarpState/rtx6000_40b/work/control/b200-supervisord.pid
childlogdir=/workspace/WarpState/rtx6000_40b/work/logs
directory=/workspace/WarpState/rtx6000_40b
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/WarpState/rtx6000_40b/work/control/b200-supervisor.sock
history_file=/workspace/WarpState/rtx6000_40b/work/control/b200-supervisorctl-history

[program:warpstate-train]
command=/workspace/WarpState/rtx6000_40b/ops/train-b200.sh
directory=/workspace/WarpState/rtx6000_40b
autostart=false
autorestart=false
startsecs=5
startretries=0
stopsignal=USR1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/b200-train.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
