# Explicitly armed once by the user-authorized 10B -> SFT handoff.
# Existing base training is never restarted by either of these programs.
[program:warpstate-posttrain]
command=/workspace/WarpState/rtx6000_40b/ops/posttrain-handoff.sh
directory=/workspace/WarpState
autostart=false
autorestart=false
startsecs=5
startretries=0
exitcodes=0
stopsignal=USR1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/posttrain.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:warpstate-posttrain-data]
command=/workspace/WarpState/rtx6000_40b/ops/prepare-posttrain-data.sh
directory=/workspace/WarpState
autostart=false
autorestart=false
startsecs=5
startretries=0
exitcodes=0
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/posttrain-data.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
