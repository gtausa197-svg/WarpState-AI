[unix_http_server]
file=/workspace/WarpState/rtx6000_40b/work/control/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/WarpState/rtx6000_40b/work/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/workspace/WarpState/rtx6000_40b/work/control/supervisord.pid
childlogdir=/workspace/WarpState/rtx6000_40b/work/logs
directory=/workspace/WarpState/rtx6000_40b
user=root
umask=022

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/WarpState/rtx6000_40b/work/control/supervisor.sock

[include]
files=/workspace/WarpState/rtx6000_40b/ops/benchmark-supervisord.conf /workspace/WarpState/rtx6000_40b/ops/posttrain-supervisord.conf /workspace/WarpState/rtx6000_40b/ops/dpo-supervisord.conf

[program:warpstate-prepare]
command=/workspace/WarpState/rtx6000_40b/ops/prepare-data.sh
directory=/workspace/WarpState/rtx6000_40b
# The corpus is complete; preparation is an explicit maintenance action.
autostart=false
autorestart=false
exitcodes=0
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=600
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/prepare.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:warpstate-train]
# User-requested pause at the first completed update past 10B tokens.
# Keep the absolute boundary across restarts until a later resume is requested.
command=/workspace/WarpState/rtx6000_40b/ops/train-local-resume.sh --stop-at-step 76294
directory=/workspace/WarpState/rtx6000_40b
autostart=false
# A failed memory check must not become a restart loop.
autorestart=false
startsecs=5
startretries=0
stopsignal=USR1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/train.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
