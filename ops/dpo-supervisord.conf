# User-authorized follow-on job; archive completed SFT before starting DPO.
[program:warpstate-dpo]
command=/workspace/WarpState/rtx6000_40b/ops/dpo-handoff.sh
directory=/workspace/WarpState
autostart=false
autorestart=false
startsecs=5
startretries=0
exitcodes=0
stopsignal=USR1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/dpo.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
