[program:warpstate-benchmark]
command=/workspace/WarpState/rtx6000_40b/ops/benchmark.sh --checkpoint /workspace/WarpState/rtx6000_40b/work/run/latest.pt --micro-batch 4 --no-activation-checkpointing --compile-cores --autocast-cache --loss-chunk-size 1024 --vram-limit-gib 88 --warmup-updates 2 --measured-updates 3
directory=/workspace/WarpState/rtx6000_40b
autostart=false
autorestart=false
startsecs=5
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/WarpState/rtx6000_40b/work/logs/benchmark.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
environment=TORCHINDUCTOR_COMPILE_THREADS="8",WARPSTATE_BENCH_DEVICES="0,1",WARPSTATE_BENCH_PROCESSES="2"
